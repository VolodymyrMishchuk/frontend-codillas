<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Маніпуляція DOM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

</head>

<body>
<div id="app-container" class="container mt-5">
    <h1 id="title">Ласкаво просимо до маніпуляції DOM!</h1>

    <button id="change-text-btn" class="btn btn-primary my-3">Змінити заголовок</button>
    <br/>

    <img id="image" src="https://placehold.co/300x300" class="rounded" alt="placeholder" style="cursor:pointer;"><br/>

    <button id="toggle-image-btn" class="btn btn-secondary my-3">Перемкнути стиль зображення</button>
    <br/>

    <p id="description">Це стандартний опис, який можна оновити.</p>

    <button id="update-description-btn" class="btn btn-success">Оновити опис</button>
</div>
    <script src="script.js"></script>

</html>
